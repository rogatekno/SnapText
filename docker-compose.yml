# Docker Compose for SnapText OCR Service
# Optimized for AWS t3 instances (burstable, lightweight)

version: '3.8'

services:
  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: snaptext-ocr:latest
    container_name: snaptext-ocr

    # Environment variables
    environment:
      # App Configuration
      - APP_NAME=SnapText
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - DEBUG=false

      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1

      # API Configuration
      - API_V1_PREFIX=/api/v1

      # CORS Configuration (adjust for production)
      - CORS_ORIGINS=["*"]
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_ALLOW_METHODS=["*"]
      - CORS_ALLOW_HEADERS=["*"]

      # RapidOCR Configuration
      - OCR_LANG=id
      - OCR_USE_ANGLE_CLS=true

      # Upload Configuration
      - MAX_UPLOAD_SIZE_MB=10

      # Logging Configuration
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - LOG_FILE_PATH=logs/app.log
      - LOG_ROTATION=500 MB
      - LOG_RETENTION=10 days

      # Performance Configuration (tuned for t3 instances)
      - REQUEST_TIMEOUT_SECONDS=60
      - ASYNC_PROCESSING_ENABLED=true

      # Local LLM Configuration
      - LLM_ENABLED=true
      - LLM_MODEL_REPO=${LLM_MODEL_REPO:-Qwen/Qwen2.5-0.5B-Instruct-GGUF}
      - LLM_MODEL_FILE=${LLM_MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
      - LLM_MODEL_PATH=/app/models/${LLM_MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
      - LLM_N_THREADS=${LLM_N_THREADS:-2}
      - HF_HOME=/tmp/huggingface_cache

      # PaddlePaddle Environment Variables (CRITICAL)
      - INFERENCE_ENFORCE_USE_ONEDNN=0
      - FLAGS_use_mkldnn=false
      - XLAN_ENABLE=0
      - FLAGS_cudnn_frontend_ops=False
      - FLAGS_use_cublas_tensorop_math=false

    # Resource limits (INCREASED for PaddleOCR + LLM - minimum 4GB recommended)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G

    # Restart policy
    restart: unless-stopped

    # Volume mounts
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist LLM models (prevent re-download on restart)
      - ./models:/app/models
      # Cache for OCR models
      - ocr-cache:/tmp/ocr_cache

    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    expose:
      - 8000
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.snaptext-ocr.rule=Host(`snaptext.rogatekno.my.id`)"
      - "traefik.http.routers.snaptext-ocr.entrypoints=websecure"
      - "traefik.http.routers.snaptext-ocr.tls=true"
      - "traefik.http.routers.snaptext-ocr.tls.certresolver=letsencrypt"
      - "traefik.http.services.snaptext-ocr.loadbalancer.server.port=8000"

# Named volumes
volumes:
  ocr-cache:
    driver: local

# Network configuration
networks:
  coolify:
    external: true
  default:
    driver: bridge
